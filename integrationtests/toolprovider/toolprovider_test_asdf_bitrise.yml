format_version: "17"
default_step_lib_source: https://github.com/bitrise-io/bitrise-steplib.git

tools:
  nodejs: 22:latest

tool_config:
  provider: asdf

workflows:
  toolprovider_test:
    steps:
      - script@1:
          title: Test activated tool
          inputs:
            - content: |
                set -ex
                echo "$PATH"
                command -v node
                node --version
                node --version | grep -Eq "^v22\\."
