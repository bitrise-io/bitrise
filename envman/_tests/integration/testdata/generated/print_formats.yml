steps:
- args: [init]
  exit_code: 0
  changed_files:
    .envstore.yml: |
      envs: []
- args: [add, --key, A, --value, a]
  exit_code: 0
  changed_files:
    .envstore.yml: |
      envs:
      - A: a
- args: [add, --key, B, --value, "multi\nline \"quoted\" $A"]
  exit_code: 0
  changed_files:
    .envstore.yml: |
      envs:
      - A: a
      - B: |-
          multi
          line "quoted" $A
- args: [print]
  exit_code: 0
  stdout: |2


    A: a
    B: multi
    line "quoted" $A
- args: [print, --format, raw]
  exit_code: 0
  stdout: |2


    A: a
    B: multi
    line "quoted" $A
- args: [print, --format, json]
  exit_code: 0
  stdout: |
    {"A":"a","B":"multi\nline \"quoted\" $A"}
- args: [print, --format, envlist]
  exit_code: 0
  stdout: |2


    export A="a"
    export B="multi\nline \"quoted\" $A"
- args: [print, --format, envlist, --expand]
  exit_code: 0
  stdout: |2


    export A="a"
    export B="multi\nline \"quoted\" a"
- args: [p, --format=json]
  exit_code: 0
  stdout: |
    {"A":"a","B":"multi\nline \"quoted\" $A"}
- args: [print, --format, invalid]
  exit_code: 1
  stderr: |
    FATA[HH:MM:SS] Invalid format: invalid
- args: [print, --format, ""]
  exit_code: 0
  stdout: |2


    A: a
    B: multi
    line "quoted" $A
